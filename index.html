        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }

      .animated-gradient-bg {
        background: linear-gradient(-45deg, #37302c, #524339, #695742, #292524);
        background-size: 400% 400%;
        animation: moveGradient 25s ease infinite;
      }
      .animated-gradient-bg-darker {
        background: linear-gradient(-45deg, #2a2421, #3b3029, #4a3e30, #1c1917);

      }
